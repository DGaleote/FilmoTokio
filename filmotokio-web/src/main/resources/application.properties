spring.datasource.url=${FILMOTOKIO_DB_URL:jdbc:mysql://localhost:3306/filmotokio}
spring.datasource.username=${FILMOTOKIO_DB_USER:root}
spring.datasource.password=${FILMOTOKIO_DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
filmotokio.uploads.posters=../uploads/posters
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# REST ratings service
filmotokio.rest.base-url=http://localhost:8081
filmotokio.rest.client.username=filmotokio-web
filmotokio.rest.client.password=${FILMOTOKIO_REST_CLIENT_PASSWORD:change_me}

# Administrador inicial para entorno académico/local.
# Estos valores se usan únicamente si el usuario todavía no existe.
# Pueden cambiarse antes del primer arranque.
# No usar así en producción.
filmotokio.admin.username=admin
filmotokio.admin.password=Admin2026!
filmotokio.admin.email=admin@filmotokio.local
filmotokio.admin.name=Administrador
filmotokio.admin.surname=FilmoTokio
filmotokio.admin.birth-date=1970-01-01

# Codificación UTF-8 para los mensajes
spring.messages.encoding=UTF-8