# =========================================================
# MÓDULO WEB
# La configuración editable está centralizada en:
# config/application.properties
# =========================================================


# ---------------------------------------------------------
# SERVIDOR
# ---------------------------------------------------------

server.port=${filmotokio.config.web.port}


# ---------------------------------------------------------
# BASE DE DATOS
# ---------------------------------------------------------

spring.datasource.url=jdbc:mysql://${filmotokio.config.db.host}:${filmotokio.config.db.port}/${filmotokio.config.db.name}
spring.datasource.username=${filmotokio.config.db.username}
spring.datasource.password=${filmotokio.config.db.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ---------------------------------------------------------
# SERVICIO REST DE VALORACIONES
# ---------------------------------------------------------

filmotokio.rest.base-url=http://${filmotokio.config.rest.host}:${filmotokio.config.rest.port}


# ---------------------------------------------------------
# MENSAJES
# ---------------------------------------------------------

spring.messages.encoding=UTF-8