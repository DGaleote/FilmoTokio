<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Filmotokio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/filmotokio.css}">
    <link rel="icon"
          type="image/png"
          th:href="@{/images/branding/filmotokio-favicon-32.png}">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4">
    <div class="d-flex flex-column flex-md-row
            justify-content-between align-items-md-center
            gap-3 mb-3">
        <h1 class="mb-0">
            Listado de películas
        </h1>
        <a th:href="@{/films/create}"
           class="btn btn-primary btn-lg">
            Añadir
        </a>
    </div>
    <form th:action="@{/}" method="get" class="row g-2 mb-4">
        <div class="col-md-6">
            <input type="text"
                   name="search"
                   class="form-control"
                   placeholder="Buscar por título">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">
                Buscar
            </button>
        </div>
        <div class="col-auto">
            <a th:href="@{/}" class="btn btn-outline-secondary">
                Limpiar
            </a>
        </div>
    </form>
    <div class="d-flex flex-column gap-3">
        <article class="card shadow-sm border-0"
                 th:each="film : ${films}">
            <div class="d-flex align-items-stretch">
                <a th:href="@{/films/{id}(id=${film.id})}"
                   class="d-block">
                    <img th:src="${film.poster != null}
                    ? @{'/posters/' + ${film.poster}}
                    : @{/images/branding/filmotokio-poster-placeholder.png}"
                         class="film-card-poster"
                         alt="Póster de la película"
                         onerror="this.onerror=null; this.src='/images/branding/filmotokio-poster-placeholder.png';">
                </a>
                <div class="card-body d-flex align-items-center justify-content-between gap-3">
                    <div>
                        <h2 class="h5 card-title mb-2">
                            <a th:href="@{/films/{id}(id=${film.id})}"
                               th:text="${film.title}"
                               class="text-decoration-none">
                            </a>
                        </h2>
                        <p class="text-muted mb-0">
                            Año:
                            <span th:text="${film.year}"></span>
                        </p>
                    </div>
                    <form sec:authorize="hasRole('ADMIN')"
                          th:action="@{/films/{id}/delete(id=${film.id})}"
                          method="post">
                        <button type="submit"
                                class="btn btn-outline-danger btn-sm"
                                onclick="return confirm('¿Seguro que quieres borrar esta película?');">
                            Borrar
                        </button>
                    </form>
                </div>
            </div>
        </article>
    </div>
</main>
</body>
</html>
