<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="${artist.id == null
            ? 'Crear artista | FilmoTokio'
            : 'Editar artista | FilmoTokio'}">
        Crear artista | FilmoTokio
    </title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/filmotokio.css}">

    <link rel="icon"
          type="image/png"
          th:href="@{/images/branding/filmotokio-favicon-32.png}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center"
           th:href="@{/films}">

            <img th:src="@{/images/branding/filmotokio-logo-navbar.png}"
                 alt="FilmoTokio"
                 class="navbar-logo">
        </a>

        <div class="d-flex align-items-center gap-3 ms-auto"
             sec:authorize="isAuthenticated()">

            <span class="text-muted">
                Hola,
                <strong class="text-light"
                        sec:authentication="name">
                    usuario
                </strong>
            </span>

            <form th:action="@{/logout}"
                  method="post"
                  class="m-0">

                <button type="submit"
                        class="btn btn-outline-light btn-sm">
                    Cerrar sesión
                </button>
            </form>

        </div>

    </div>
</nav>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-xl-6">

            <section class="card border-0 shadow">

                <div class="card-body p-4 p-md-5">

                    <h1 class="mb-2"
                        th:text="${artist.id == null
                            ? 'Crear artista'
                            : 'Editar artista'}">
                        Crear artista
                    </h1>

                    <p class="text-muted mb-4"
                       th:text="${artist.id == null
                            ? 'Añade un nuevo actor o director a FilmoTokio.'
                            : 'Modifica los datos del artista seleccionado.'}">
                        Añade un nuevo actor o director a FilmoTokio.
                    </p>

                    <form th:action="@{/artists/create}"
                          th:object="${artist}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="mb-3">

                            <label for="name"
                                   class="form-label">
                                Nombre
                            </label>

                            <input id="name"
                                   type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('name')}
                                       ? ' is-invalid'"
                                   autocomplete="given-name"
                                   autofocus
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label for="surname"
                                   class="form-label">
                                Apellidos
                            </label>

                            <input id="surname"
                                   type="text"
                                   th:field="*{surname}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('surname')}
                                       ? ' is-invalid'"
                                   autocomplete="family-name"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('surname')}"
                                 th:errors="*{surname}">
                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="type"
                                   class="form-label">
                                Tipo
                            </label>

                            <select id="type"
                                    th:field="*{type}"
                                    class="form-select"
                                    th:classappend="${#fields.hasErrors('type')}
                                        ? ' is-invalid'"
                                    required>

                                <option value="">
                                    Selecciona un tipo
                                </option>

                                <option value="ACTOR">
                                    Actor
                                </option>

                                <option value="DIRECTOR">
                                    Director
                                </option>

                            </select>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('type')}"
                                 th:errors="*{type}">
                            </div>

                        </div>

                        <div class="d-flex flex-column flex-sm-row gap-2">

                            <button type="submit"
                                    class="btn btn-primary">

                                <span th:text="${artist.id == null
                                        ? 'Crear artista'
                                        : 'Guardar cambios'}">
                                    Crear artista
                                </span>

                            </button>

                            <a th:href="@{/artists}"
                               class="btn btn-outline-light">
                                Volver a artistas
                            </a>

                        </div>

                    </form>

                </div>

            </section>

        </div>

    </div>

</main>

</body>
</html>
