<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="${film.title} + ' | FilmoTokio'">
        Detalle de película
    </title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/filmotokio.css}">

    <link rel="icon"
          type="image/png"
          th:href="@{/images/branding/filmotokio-favicon-32.png}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">

    <article class="card border-0 shadow-sm film-detail-card">

        <div class="row g-0">

            <div class="col-12 col-md-auto">

                <img th:src="${film.poster != null}
                                ? @{'/posters/' + ${film.poster}}
                                : @{/images/branding/filmotokio-poster-placeholder.png}"
                     class="film-detail-poster"
                     alt="Póster de la película"
                     onerror="this.onerror=null; this.src='/images/branding/filmotokio-poster-placeholder.png';">

            </div>

            <div class="col">

                <div class="card-body p-4">

                    <h1 class="film-detail-title mb-3"
                        th:text="${film.title}">
                    </h1>

                    <div th:if="${ratingsAvailable}"
                         class="film-rating-panel mb-4">

                        <div class="d-flex flex-wrap gap-4 mb-3">

                            <p class="mb-0">
                                <strong>Valoración media:</strong>

                                <span th:if="${ratingAverage.ratings == 0}">
                                    Sin valoraciones
                                </span>

                                <span th:if="${ratingAverage.ratings > 0}">
                                    <span th:text="${ratingAverage.average}"></span>
                                    / 5
                                </span>
                            </p>

                            <p th:if="${userRating != null}"
                               class="mb-0">

                                <strong>Tu valoración:</strong>

                                <span th:text="${userRating.score}"></span>
                                / 5
                            </p>

                        </div>

                        <p th:if="${userRating == null}"
                           class="text-muted">

                            Todavía no has valorado esta película.
                        </p>

                        <form th:if="${userRating == null}"
                              th:action="@{/films/{id}/ratings(id=${film.id})}"
                              method="post"
                              class="d-flex flex-wrap align-items-end gap-2">

                            <div>

                                <label for="score"
                                       class="form-label">
                                    Valoración
                                </label>

                                <select id="score"
                                        name="score"
                                        class="form-select"
                                        required>

                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>

                                </select>

                            </div>

                            <button type="submit"
                                    class="btn btn-primary">
                                Valorar
                            </button>

                        </form>

                    </div>

                    <div th:if="${ratingsAvailable == false}"
                         class="alert alert-danger"
                         role="alert">

                        El servicio de valoraciones no está disponible
                        en este momento.
                    </div>

                    <dl class="row film-metadata">

                        <dt class="col-sm-3">
                            Año
                        </dt>

                        <dd class="col-sm-9"
                            th:text="${film.year}">
                        </dd>

                        <dt class="col-sm-3">
                            Director
                        </dt>

                        <dd class="col-sm-9"
                            th:text="${film.director}">
                        </dd>

                        <dt class="col-sm-3">
                            Sinopsis
                        </dt>

                        <dd class="col-sm-9"
                            th:text="${film.synopsis}">
                        </dd>

                    </dl>

                    <section class="mt-4">

                        <h2 class="h4">
                            Actores
                        </h2>

                        <ul class="list-group list-group-flush film-actor-list">

                            <li class="list-group-item"
                                th:each="actor : ${film.actors}"
                                th:text="${actor}">
                            </li>

                        </ul>

                    </section>

                    <div class="d-flex flex-wrap gap-2 mt-4">

                        <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/films/{id}/edit(id=${film.id})}"
                           class="btn btn-primary">

                            Editar película
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </article>

</main>

</body>
</html>
