<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Página no encontrada | FilmoTokio</title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/filmotokio.css}">

    <link rel="icon"
          type="image/png"
          th:href="@{/images/branding/filmotokio-favicon-32.png}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center"
           th:href="@{/}">

            <img th:src="@{/images/branding/filmotokio-logo-navbar.png}"
                 alt="FilmoTokio"
                 class="navbar-logo">
        </a>

        <div class="d-flex align-items-center gap-3 ms-auto"
             sec:authorize="isAuthenticated()">

            <span class="text-muted">
                Hola,
                <strong class="text-light"
                        sec:authentication="name">
                    usuario
                </strong>
            </span>

            <form th:action="@{/logout}"
                  method="post"
                  class="m-0">

                <button type="submit"
                        class="btn btn-outline-light btn-sm">
                    Cerrar sesión
                </button>
            </form>

        </div>

    </div>
</nav>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <section class="card border-0 shadow text-center">

                <div class="card-body p-4 p-md-5">

                    <div class="display-1 fw-bold text-danger mb-2">
                        404
                    </div>

                    <h1 class="mb-3">
                        Página no encontrada
                    </h1>

                    <p class="text-muted mb-4">
                        La página que estás buscando no existe,
                        ha sido movida o ya no está disponible.
                    </p>

                    <a th:href="@{/films}"
                       class="btn btn-primary">
                        Volver a películas
                    </a>

                </div>

            </section>

        </div>

    </div>

</main>

</body>
</html>
