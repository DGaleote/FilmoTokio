<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Registro | FilmoTokio</title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/filmotokio.css}">

    <link rel="icon"
          type="image/png"
          th:href="@{/images/branding/filmotokio-favicon-32.png}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center"
           th:href="@{/}">

            <img th:src="@{/images/branding/filmotokio-logo-navbar.png}"
                 alt="FilmoTokio"
                 class="navbar-logo">
        </a>

    </div>
</nav>

<main class="container py-5">

    <div class="register-wrapper">

        <section class="card border-0 shadow register-card">

            <div class="card-body p-4 p-md-5">

                <h1 class="register-title mb-2">
                    Crear una cuenta
                </h1>

                <p class="text-muted mb-4">
                    Regístrate para acceder a FilmoTokio.
                </p>

                <form th:object="${registerUserDTO}"
                      th:action="@{/register}"
                      method="post">

                    <div class="alert alert-danger"
                         role="alert"
                         th:if="${#fields.hasGlobalErrors() or #fields.hasErrors('birthDate')}">

                        <p class="mb-0"
                           th:each="error : ${#fields.globalErrors()}"
                           th:text="${error}">
                            Error de registro
                        </p>

                        <p class="mb-0"
                           th:if="${#fields.hasErrors('birthDate')}"
                           th:errors="*{birthDate}">
                        </p>

                    </div>

                    <div class="mb-3">

                        <label for="username"
                               class="form-label">
                            Usuario
                        </label>

                        <input id="username"
                               type="text"
                               th:field="*{username}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('username')} ? ' is-invalid'"
                               autocomplete="username"
                               required
                               autofocus>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('username')}"
                             th:errors="*{username}">
                        </div>

                    </div>

                    <div class="mb-3">

                        <label for="email"
                               class="form-label">
                            Email
                        </label>

                        <input id="email"
                               type="email"
                               th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                               autocomplete="email"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                    <div class="row g-3 mb-3">

                        <div class="col-md-6">

                            <label for="name"
                                   class="form-label">
                                Nombre
                            </label>

                            <input id="name"
                                   type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                                   autocomplete="given-name"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}">
                            </div>

                        </div>

                        <div class="col-md-6">

                            <label for="surname"
                                   class="form-label">
                                Apellidos
                            </label>

                            <input id="surname"
                                   type="text"
                                   th:field="*{surname}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('surname')} ? ' is-invalid'"
                                   autocomplete="family-name"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('surname')}"
                                 th:errors="*{surname}">
                            </div>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label for="birthDate"
                               class="form-label">
                            Fecha de nacimiento
                        </label>

                        <input id="birthDate"
                               type="text"
                               th:field="*{birthDate}"
                               class="form-control"
                               placeholder="dia/mes/año"
                               inputmode="numeric"
                               autocomplete="bday"
                               required>

                    </div>

                    <div class="row g-3 mb-4">

                        <div class="col-md-6">

                            <label for="password"
                                   class="form-label">
                                Contraseña
                            </label>

                            <input id="password"
                                   type="password"
                                   th:field="*{password}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'"
                                   autocomplete="new-password"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}">
                            </div>

                        </div>

                        <div class="col-md-6">

                            <label for="passwordBis"
                                   class="form-label">
                                Repetir contraseña
                            </label>

                            <input id="passwordBis"
                                   type="password"
                                   th:field="*{passwordBis}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('passwordBis')} ? ' is-invalid'"
                                   autocomplete="new-password"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('passwordBis')}"
                                 th:errors="*{passwordBis}">
                            </div>

                        </div>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Crear cuenta
                    </button>

                </form>

                <div class="register-links mt-4">

                    <p class="mb-2">
                        ¿Ya tienes una cuenta?

                        <a th:href="@{/login}">
                            Iniciar sesión
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </div>

</main>

</body>
</html>
