<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="${film.id == null ? 'Añadir película | FilmoTokio' : 'Editar película | FilmoTokio'}">
        Añadir película | FilmoTokio
    </title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/filmotokio.css}">

    <link rel="icon"
          type="image/png"
          th:href="@{/images/branding/filmotokio-favicon-32.png}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <section class="card border-0 shadow film-form-card">
        <div class="card-body p-4 p-md-5">

            <div class="mb-4">
                <h1 class="mb-2"
                    th:text="${film.id == null ? 'Añadir película' : 'Editar película'}">
                    Añadir película
                </h1>

                <p class="text-muted mb-0"
                   th:text="${film.id == null
                        ? 'Añade los datos principales y el póster de la película.'
                        : 'Actualiza los datos y guarda los cambios.'}">
                    Añade los datos principales y el póster de la película.
                </p>
            </div>

            <form th:object="${film}"
                  th:action="@{/films/create}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:field="*{id}">

                <div class="alert alert-danger"
                     role="alert"
                     th:if="${#fields.hasGlobalErrors()}">

                    <p class="mb-0"
                       th:each="error : ${#fields.globalErrors()}"
                       th:text="${error}">
                        No se ha podido guardar la película.
                    </p>

                </div>

                <div class="row g-4">

                    <div class="col-lg-8">

                        <div class="mb-3">
                            <label for="title" class="form-label">Título</label>

                            <input id="title"
                                   type="text"
                                   th:field="*{title}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'"
                                   autocomplete="off"
                                   required
                                   autofocus>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('title')}"
                                 th:errors="*{title}">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">

                            <div class="col-md-4">
                                <label for="year" class="form-label">Año</label>

                                <input id="year"
                                       type="number"
                                       th:field="*{year}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('year')} ? ' is-invalid'"
                                       min="1900"
                                       max="2100"
                                       inputmode="numeric">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('year')}"
                                     th:errors="*{year}">
                                </div>
                            </div>

                            <div class="col-md-8">
                                <label for="director" class="form-label">Director</label>

                                <select id="director"
                                        th:field="*{director}"
                                        class="form-select"
                                        th:classappend="${#fields.hasErrors('director')} ? ' is-invalid'">

                                    <option value="">Selecciona un director</option>

                                    <option th:each="artist : ${directors}"
                                            th:value="${artist.id}"
                                            th:text="${artist.name + ' ' + artist.surname}">
                                    </option>
                                </select>

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('director')}"
                                     th:errors="*{director}">
                                </div>
                            </div>

                        </div>

                        <div class="mb-3">
                            <label for="actors" class="form-label">Actores</label>

                            <select id="actors"
                                    th:field="*{actors}"
                                    class="form-select film-actors-select"
                                    th:classappend="${#fields.hasErrors('actors')} ? ' is-invalid'"
                                    multiple
                                    size="7">

                                <option th:each="artist : ${actors}"
                                        th:value="${artist.id}"
                                        th:text="${artist.name + ' ' + artist.surname}">
                                </option>
                            </select>

                            <div class="form-text">
                                Mantén pulsada Ctrl para seleccionar varios actores.
                            </div>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('actors')}"
                                 th:errors="*{actors}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="synopsis" class="form-label">Sinopsis</label>

                            <textarea id="synopsis"
                                      th:field="*{synopsis}"
                                      class="form-control"
                                      rows="7"
                                      placeholder="Escribe una breve sinopsis..."></textarea>
                        </div>

                    </div>

                    <div class="col-lg-4">

                        <div class="film-poster-editor">
                            <label for="posterFile" class="form-label d-block">
                                <span th:text="${film.poster != null ? 'Cambiar póster' : 'Póster'}">
                                    Póster
                                </span>
                            </label>

                            <img id="posterPreview"
                                 th:src="${film.poster != null}
                                    ? @{'/posters/' + ${film.poster}}
                                    : @{/images/branding/filmotokio-poster-placeholder.png}"
                                 class="film-form-poster mb-3"
                                 alt="Vista previa del póster"
                                 onerror="this.onerror=null; this.src='/images/branding/filmotokio-poster-placeholder.png';">

                            <input id="posterFile"
                                   type="file"
                                   name="posterFile"
                                   class="form-control"
                                   accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">

                            <div class="form-text">
                                JPG, PNG o WEBP. Tamaño máximo: 2 MB.
                            </div>

                            <div class="invalid-feedback d-block"
                                 th:if="${#fields.hasErrors('poster')}"
                                 th:errors="*{poster}">
                            </div>

                        </div>

                    </div>

                </div>

                <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 mt-4 pt-3 border-top">

                    <a class="btn btn-outline-light"
                       th:href="${film.id == null ? '/films' : '/films/' + film.id}"
                       th:text="${film.id == null ? 'Cancelar' : 'Volver a la ficha'}">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary px-4">
                        <span th:text="${film.id == null ? 'Añadir' : 'Guardar cambios'}">
                            Añadir
                        </span>
                    </button>

                </div>

            </form>

        </div>
    </section>

</main>

<script>
    const posterFileInput = document.getElementById("posterFile");
    const posterPreview = document.getElementById("posterPreview");
    const MAX_POSTER_SIZE = 2 * 1024 * 1024;

    posterFileInput.addEventListener("change", function () {
        const file = posterFileInput.files[0];

        if (!file) {
            return;
        }

        if (file.size > MAX_POSTER_SIZE) {
            alert("El póster no puede superar los 2 MB.");

            posterFileInput.value = "";

            if (posterPreview) {
                posterPreview.src =
                    "/images/branding/filmotokio-poster-placeholder.png";
            }

            return;
        }

        if (!file.type.startsWith("image/")) {
            return;
        }

        if (posterPreview) {
            posterPreview.src = URL.createObjectURL(file);
        }
    });
</script>

</body>
</html>
