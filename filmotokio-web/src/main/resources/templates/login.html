<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Iniciar sesión | FilmoTokio</title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/filmotokio.css}">

    <link rel="icon"
          type="image/png"
          th:href="@{/images/branding/filmotokio-favicon-32.png}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center"
           th:href="@{/}">

            <img th:src="@{/images/branding/filmotokio-logo-navbar.png}"
                 alt="FilmoTokio"
                 class="navbar-logo">
        </a>

    </div>
</nav>

<main class="container py-5">

    <div class="login-wrapper">

        <section class="card border-0 shadow login-card">

            <div class="card-body p-4 p-md-5">

                <h1 class="login-title mb-2">
                    Iniciar sesión
                </h1>

                <p class="text-muted mb-4">
                    Accede a tu cuenta de FilmoTokio.
                </p>

                <div class="alert alert-danger"
                     role="alert"
                     th:if="${param.error}">

                    Usuario, email o contraseña incorrectos.
                </div>

                <div class="alert alert-success"
                     role="alert"
                     th:if="${param.logout}">

                    Sesión cerrada correctamente.
                </div>

                <form th:action="@{/login}"
                      method="post">

                    <div class="mb-3">

                        <label for="username"
                               class="form-label">
                            Usuario o email
                        </label>

                        <input id="username"
                               type="text"
                               name="username"
                               class="form-control"
                               autocomplete="username"
                               required
                               autofocus>
                    </div>

                    <div class="mb-4">

                        <label for="password"
                               class="form-label">
                            Contraseña
                        </label>

                        <input id="password"
                               type="password"
                               name="password"
                               class="form-control"
                               autocomplete="current-password"
                               required>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Entrar
                    </button>

                </form>

                <div class="login-links mt-4">

                    <p class="mb-2">
                        ¿Todavía no tienes cuenta?

                        <a th:href="@{/register}">
                            Registrarse
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </div>

</main>

</body>
</html>
