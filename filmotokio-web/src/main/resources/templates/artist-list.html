<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Artistas | FilmoTokio</title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/filmotokio.css}">

    <link rel="icon"
          type="image/png"
          th:href="@{/images/branding/filmotokio-favicon-32.png}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center"
           th:href="@{/films}">
            <img th:src="@{/images/branding/filmotokio-logo-navbar.png}"
                 alt="FilmoTokio"
                 class="navbar-logo">
        </a>

        <div class="d-flex align-items-center gap-3 ms-auto"
             sec:authorize="isAuthenticated()">

            <span class="text-muted">
                Hola,
                <strong class="text-light"
                        sec:authentication="name">
                    usuario
                </strong>
            </span>

            <form th:action="@{/logout}"
                  method="post"
                  class="m-0">
                <button type="submit"
                        class="btn btn-outline-light btn-sm">
                    Cerrar sesión
                </button>
            </form>

        </div>

    </div>
</nav>

<main class="container py-5">

    <section class="card border-0 shadow">

        <div class="card-body p-4 p-md-5">

            <div class="d-flex flex-column flex-md-row
                        justify-content-between align-items-md-center
                        gap-3 mb-4">

                <div>
                    <h1 class="mb-2">Artistas</h1>
                    <p class="text-muted mb-0">
                        Gestiona los directores y actores disponibles en FilmoTokio.
                    </p>
                </div>

                <a th:href="@{/artists/create}"
                   class="btn btn-primary">
                    Crear artista
                </a>

            </div>

            <div class="alert alert-secondary"
                 th:if="${#lists.isEmpty(artists)}">
                Todavía no hay artistas registrados.
            </div>

            <div class="table-responsive"
                 th:unless="${#lists.isEmpty(artists)}">

                <table class="table table-dark table-hover align-middle mb-0">

                    <thead>
                    <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col">Apellidos</th>
                        <th scope="col">Tipo</th>
                        <th scope="col"
                            class="text-end"
                            sec:authorize="hasRole('ADMIN')">
                            Acciones
                        </th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="artist : ${artists}">

                        <td th:text="${artist.name}">
                            Nombre
                        </td>

                        <td th:text="${artist.surname}">
                            Apellidos
                        </td>

                        <td>
                            <span class="badge rounded-pill text-bg-secondary"
                                  th:text="${artist.type}">
                                ACTOR
                            </span>
                        </td>

                        <td class="text-end"
                            sec:authorize="hasRole('ADMIN')">

                            <div class="d-inline-flex flex-wrap
                                        justify-content-end gap-2">

                                <a th:href="@{/artists/{id}/edit(id=${artist.id})}"
                                   class="btn btn-outline-light btn-sm">
                                    Editar
                                </a>

                                <form th:action="@{/artists/{id}/delete(id=${artist.id})}"
                                      method="post"
                                      class="m-0">

                                    <button type="submit"
                                            class="btn btn-outline-danger btn-sm"
                                            onclick="return confirm('¿Seguro que quieres borrar este artista?');">
                                        Borrar
                                    </button>

                                </form>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="mt-4">

                <a th:href="@{/films}"
                   class="btn btn-outline-light">
                    Volver a películas
                </a>

            </div>

        </div>

    </section>

</main>

</body>
</html>
