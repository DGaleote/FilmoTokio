spring.datasource.url=${FILMOTOKIO_DB_URL:jdbc:mysql://localhost:3306/filmotokio}
spring.datasource.username=${FILMOTOKIO_DB_USER:root}
spring.datasource.password=${FILMOTOKIO_DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# REST client credentials
filmotokio.rest.client.username=filmotokio-web
filmotokio.rest.client.password=${FILMOTOKIO_REST_CLIENT_PASSWORD:change_me}

# JWT
filmotokio.rest.jwt.secret=${FILMOTOKIO_JWT_SECRET:change_me_super_secret_key}
filmotokio.rest.jwt.expiration-seconds=3600