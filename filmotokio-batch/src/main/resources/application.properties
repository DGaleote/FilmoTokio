# =========================================================
# MÓDULO BATCH
# La configuración editable está centralizada en:
# config/application.properties
# =========================================================


# ---------------------------------------------------------
# BASE DE DATOS
# ---------------------------------------------------------

spring.datasource.url=jdbc:mysql://${filmotokio.config.db.host}:${filmotokio.config.db.port}/${filmotokio.config.db.name}
spring.datasource.username=${filmotokio.config.db.username}
spring.datasource.password=${filmotokio.config.db.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ---------------------------------------------------------
# SPRING BATCH
# ---------------------------------------------------------

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

filmotokio.batch.page-size=100
filmotokio.batch.chunk-size=100